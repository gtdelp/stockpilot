# Despliegue continuo: Vercel publica automáticamente cada commit de `main`
# (y una preview por cada Pull Request). `main` está protegida y solo acepta
# PRs con el pipeline de CI en verde, así que a producción solo llega código
# que ha pasado todos los tests. Este workflow verifica cada despliegue de producción.
name: Deploy

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Comprobación de humo del despliegue
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Rutas principales responden 200
        env:
          URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -e
          for path in / /login /productos /pedidos /docs/ /manifest.webmanifest; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path")
            echo "$path → $code"
            test "$code" = "200"
          done
